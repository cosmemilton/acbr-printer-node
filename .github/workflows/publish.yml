name: Stage reviewed npm release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  REVIEWED_MANIFEST: releases/0.1.1.json
  BUNDLE_DIRECTORY: .release

jobs:
  stage:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install npm with staged publishing
        run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
      - name: Check release submission logic
        run: node --test test/npm-stage-release.test.mjs
      - name: Download immutable reviewed bundle
        run: python3 scripts/download-reviewed-bundle.py "$REVIEWED_MANIFEST" "$BUNDLE_DIRECTORY"
      - name: Audit package, runtimes and licenses
        run: node scripts/npm-stage-release.mjs --audit "$BUNDLE_DIRECTORY/cosmemilton-acbr-printer-node-0.1.1.tgz" "$REVIEWED_MANIFEST" "$BUNDLE_DIRECTORY"
      - name: Preserve reviewed bundle as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view v0.1.1 >/dev/null 2>&1; then
            gh release create v0.1.1 --target 619d05eec71564bb7343b4cdb7f275cdd83947bb --title 'ACBr Printer Node 0.1.1' --notes 'Pacote auditado com runtimes Windows e Linux. A disponibilizacao desta release no GitHub nao confirma publicacao no npm; o envio ao npm requer aprovacao em Staged Packages.'
          fi
          gh release upload v0.1.1 "$BUNDLE_DIRECTORY/cosmemilton-acbr-printer-node-0.1.1.tgz" "$BUNDLE_DIRECTORY/cosmemilton-acbr-printer-node-0.1.1.tgz.sha256" "$BUNDLE_DIRECTORY/REVIEWED_BUNDLE.json" --clobber
      - name: Submit for npm maintainer approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/npm-stage-release.mjs --stage "$BUNDLE_DIRECTORY/cosmemilton-acbr-printer-node-0.1.1.tgz" "$REVIEWED_MANIFEST" "$BUNDLE_DIRECTORY"
      - name: Save sanitized publication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-publication-result-0.1.1
          path: .release/PUBLICATION_RESULT.json
          if-no-files-found: ignore
